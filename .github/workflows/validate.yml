name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - run: python scripts/build_graph.py
      - name: Verify generated graph is committed
        run: git diff --exit-code -- site/data/graph.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check site/app.js
