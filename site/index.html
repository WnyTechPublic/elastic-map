<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Elastic 중심 기술 온톨로지">
  <title>Elastic Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Elastic Map 홈">Elastic Map</a>
    <a class="github-link" href="https://github.com/WnyTechPublic/elastic-map" target="_blank" rel="noreferrer">GitHub ↗</a>
  </header>

  <main>
    <section class="workspace" aria-label="온톨로지 탐색기">
      <aside class="controls">
        <label class="search-box" for="search-input">
          <span aria-hidden="true">⌕</span>
          <input id="search-input" type="search" aria-label="온톨로지 검색" placeholder="기술 또는 개념 검색" autocomplete="off">
          <kbd>/</kbd>
        </label>

        <div class="control-section">
          <div class="section-label">보기</div>
          <nav id="view-tabs" class="view-tabs" aria-label="그래프 보기 필터">
            <button class="active" data-view="all"><span>전체 지도</span><b id="count-all">—</b></button>
            <button data-view="elastic"><span>Elastic 중심</span><b>1-hop</b></button>
            <button data-view="data"><span>데이터 시스템</span><b>DB</b></button>
            <button data-view="market"><span>시장 관계</span><b>CLAIM</b></button>
          </nav>
        </div>

        <div class="control-section">
          <div class="section-label">관계</div>
          <div id="relation-filters" class="checks">
            <label><input type="checkbox" value="structural" checked><span class="line structural"></span>기술 구조</label>
            <label><input type="checkbox" value="complements" checked><span class="line complement"></span>보완 관계</label>
            <label><input type="checkbox" value="market" checked><span class="line market"></span>경쟁·중첩</label>
          </div>
        </div>
      </aside>

      <div class="canvas-wrap">
        <div class="canvas-toolbar">
          <span id="graph-status">불러오는 중</span>
          <div class="zoom-actions">
            <button id="fit-button" title="화면에 맞추기" aria-label="그래프 화면에 맞추기">◎</button>
            <button id="reset-button" title="Elastic 중심으로 이동" aria-label="Elastic 중심으로 이동">⌂</button>
          </div>
        </div>
        <div id="graph" role="img" aria-label="Elastic 기술 온톨로지 인터랙티브 그래프"></div>
        <div id="graph-fallback" class="graph-fallback" hidden>그래프를 불러오지 못했습니다.</div>
      </div>

      <aside id="detail-panel" class="detail-panel" aria-live="polite"></aside>
    </section>
  </main>
</body>
</html>
